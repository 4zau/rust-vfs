[package]
name = "rust-vfs"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/vfs-core",
    "crates/memfs",
    "crates/cpio-read",
    "crates/cpiofs",
]

[dependencies]
vfs-core = { path = "crates/vfs-core" }
cpiofs = { path = "crates/cpiofs" }
memfs = { path = "crates/memfs" }
